<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brunch Crunch: Cereal Superhero!</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0015; display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; }
canvas { border:3px solid #FF6B35; box-shadow:0 0 40px #FF6B35,0 0 80px rgba(255,107,53,0.3); display:block; }
</style>
</head>
<body>
<canvas id="c" width="900" height="650"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=900,H=650;

// ── AUDIO ──────────────────────────────────────────────────────────────────
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function tone(freq,dur,type='sine',vol=0.28){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.start();o.stop(audioCtx.currentTime+dur);
}
const sfx={
  punch:()=>tone(200,0.08,'square',0.22),
  collect:()=>{tone(880,0.1,'sine',0.28);setTimeout(()=>tone(1320,0.14,'sine',0.28),80);},
  hit:()=>tone(110,0.26,'sawtooth',0.32),
  bossHit:()=>{tone(80,0.28,'square',0.38);setTimeout(()=>tone(220,0.2,'sine',0.28),100);},
  victory:()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.45,'sine',0.38),i*140))
};

// ── INPUT ──────────────────────────────────────────────────────────────────
const keys={},jp={};
document.addEventListener('keydown',e=>{if(!keys[e.code])jp[e.code]=true;keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
function clearJP(){for(const k in jp)delete jp[k];}

// ── STATE ──────────────────────────────────────────────────────────────────
const S={TITLE:0,PLAYING:1,BOSS_INTRO:2,BOSS:3,VICTORY:4,GAMEOVER:5};
let state=S.TITLE,introTimer=0;

// ── CONSTANTS ──────────────────────────────────────────────────────────────
const CEREAL_TOTAL=15,BOSS_MAX_HP=10;
const CEREAL_COLORS=['#FF6B35','#FFD700','#FF1493','#00CED1','#32CD32','#FF69B4','#9370DB','#FF4500','#00FA9A','#FF8C00'];

// ── ENTITY STORAGE ─────────────────────────────────────────────────────────
let player,cereals,hungers,boss,lasers,particles,bgPatches;

// ── INIT ───────────────────────────────────────────────────────────────────
function resetGame(){
  player={
    x:W/2,y:H/2,vx:0,vy:0,angle:0,speed:5,
    health:3,maxHealth:3,
    punching:false,punchTimer:0,punchCool:0,
    invincible:false,iTimer:0,
    trail:[],cereals:0
  };
  cereals=[];
  for(let i=0;i<CEREAL_TOTAL;i++){
    let x,y,tries=0;
    do{x=60+Math.random()*(W-120);y=80+Math.random()*(H-160);tries++;}
    while(tries<40&&Math.hypot(x-W/2,y-H/2)<130);
    cereals.push({x,y,color:CEREAL_COLORS[i%CEREAL_COLORS.length],
      rot:Math.random()*Math.PI*2,pulse:Math.random()*Math.PI*2,collected:false});
  }
  hungers=[];
  for(let i=0;i<5;i++)hungers.push(makeHunger());
  boss=null;lasers=[];particles=[];
  bgPatches=Array.from({length:22},()=>({
    x:Math.random()*W,y:Math.random()*H,
    r:18+Math.random()*55,a:0.03+Math.random()*0.06
  }));
}

function makeHunger(fromBoss=false){
  let x,y;
  if(fromBoss&&boss){x=boss.x+(Math.random()-.5)*80;y=boss.y+(Math.random()-.5)*80;}
  else{
    let tries=0;
    do{x=50+Math.random()*(W-100);y=80+Math.random()*(H-160);tries++;}
    while(tries<30&&player&&Math.hypot(x-player.x,y-player.y)<160);
  }
  return{x,y,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,
    wobble:Math.random()*Math.PI*2,eyeP:Math.random()*Math.PI*2,
    stunned:false,stunTimer:0,flying:false,flyVx:0,flyVy:0,
    dying:false,dyingTimer:0};
}

// ── UPDATE ─────────────────────────────────────────────────────────────────
function updatePlayer(){
  const p=player;
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['KeyA'])dx-=1;
  if(keys['ArrowRight']||keys['KeyD'])dx+=1;
  if(keys['ArrowUp']||keys['KeyW'])dy-=1;
  if(keys['ArrowDown']||keys['KeyS'])dy+=1;
  const mag=Math.hypot(dx,dy);
  if(mag>0){
    dx/=mag;dy/=mag;
    const ta=Math.atan2(dy,dx);
    let da=ta-p.angle;
    while(da>Math.PI)da-=Math.PI*2;
    while(da<-Math.PI)da+=Math.PI*2;
    p.angle+=da*0.2;
  }
  p.vx=p.vx*0.82+dx*p.speed*0.18;
  p.vy=p.vy*0.82+dy*p.speed*0.18;
  p.x+=p.vx;p.y+=p.vy;
  p.x=Math.max(24,Math.min(W-24,p.x));
  p.y=Math.max(62,Math.min(H-24,p.y));
  p.trail.push({x:p.x,y:p.y});
  if(p.trail.length>10)p.trail.shift();
  if(p.punchCool>0)p.punchCool--;
  if((keys['Space']||keys['KeyZ']||keys['KeyX'])&&!p.punching&&p.punchCool===0){
    p.punching=true;p.punchTimer=18;p.punchCool=28;
    sfx.punch();checkPunch();
  }
  if(p.punchTimer>0&&--p.punchTimer===0)p.punching=false;
  if(p.invincible&&--p.iTimer<=0)p.invincible=false;
}

function checkPunch(){
  const p=player;
  const px=p.x+Math.cos(p.angle)*44,py=p.y+Math.sin(p.angle)*44;
  hungers.forEach(h=>{
    if(h.dying||h.flying)return;
    if(Math.hypot(px-h.x,py-h.y)<52){
      if(state===S.BOSS&&boss){
        h.flying=true;h.stunned=false;
        const bd=Math.hypot(boss.x-h.x,boss.y-h.y)||1;
        h.flyVx=(boss.x-h.x)/bd*11;h.flyVy=(boss.y-h.y)/bd*11;
      }else{
        h.stunned=true;h.stunTimer=90;
        const nd=Math.hypot(h.x-px,h.y-py)||1;
        h.vx=(h.x-px)/nd*7;h.vy=(h.y-py)/nd*7;
      }
      spawnParticles(h.x,h.y,'#FFD700',8);
    }
  });
}

function updateCereals(){
  cereals.forEach(c=>{
    if(c.collected)return;
    c.rot+=0.025;c.pulse+=0.07;
    if(Math.hypot(player.x-c.x,player.y-c.y)<28){
      c.collected=true;player.cereals++;
      sfx.collect();spawnParticles(c.x,c.y,c.color,14,true);
      if(player.cereals>=CEREAL_TOTAL){
        state=S.BOSS_INTRO;introTimer=150;
        hungers=[];lasers=[];
      }
    }
  });
}

function updateHungers(){
  const rem=[];
  hungers.forEach((h,i)=>{
    if(h.flying){
      if(!boss){rem.push(i);return;}
      h.x+=h.flyVx;h.y+=h.flyVy;
      if(Math.hypot(h.x-boss.x,h.y-boss.y)<70){
        boss.hp--;boss.hitFlash=18;rem.push(i);
        spawnParticles(boss.x+(Math.random()-.5)*80,boss.y+(Math.random()-.5)*60,'#FF6600',22,true);
        sfx.bossHit();
        if(boss.hp<=0){spawnParticles(boss.x,boss.y,'#FFD700',50,true);setTimeout(()=>{state=S.VICTORY;sfx.victory();},800);}
      }else if(h.x<-150||h.x>W+150||h.y<-150||h.y>H+150)rem.push(i);
      return;
    }
    if(h.dying){if(--h.dyingTimer<=0)rem.push(i);return;}
    if(h.stunned){
      h.stunTimer--;h.x+=h.vx;h.y+=h.vy;h.vx*=0.87;h.vy*=0.87;
      h.x=Math.max(30,Math.min(W-30,h.x));h.y=Math.max(70,Math.min(H-30,h.y));
      if(h.x<=30||h.x>=W-30)h.vx*=-1;if(h.y<=70||h.y>=H-30)h.vy*=-1;
      if(h.stunTimer<=0)h.stunned=false;return;
    }
    const dx=player.x-h.x,dy=player.y-h.y,d=Math.hypot(dx,dy)||1;
    h.wobble+=0.04;
    const spd=state===S.BOSS?1.4:0.95;
    h.vx+=(dx/d)*0.08+Math.sin(h.wobble)*0.14;
    h.vy+=(dy/d)*0.08+Math.cos(h.wobble*0.9)*0.14;
    const cs=Math.hypot(h.vx,h.vy);
    if(cs>spd){h.vx=h.vx/cs*spd;h.vy=h.vy/cs*spd;}
    h.x+=h.vx;h.y+=h.vy;
    h.x=Math.max(30,Math.min(W-30,h.x));h.y=Math.max(70,Math.min(H-30,h.y));
    if(h.x<=30||h.x>=W-30)h.vx*=-1;if(h.y<=70||h.y>=H-30)h.vy*=-1;
    if(!player.invincible&&d<30){
      player.health--;player.invincible=true;player.iTimer=90;
      sfx.hit();spawnParticles(player.x,player.y,'#FF3300',10);
      if(player.health<=0)state=S.GAMEOVER;
    }
  });
  for(let i=rem.length-1;i>=0;i--)hungers.splice(rem[i],1);
  if(state===S.PLAYING&&hungers.length<7&&Math.random()<0.004)hungers.push(makeHunger());
  if(state===S.BOSS&&boss){
    boss.spawnTimer++;
    if(boss.spawnTimer>=boss.spawnCool&&hungers.length<8){boss.spawnTimer=0;hungers.push(makeHunger(true));}
  }
}

function updateBoss(){
  if(!boss)return;
  boss.wobble+=0.016;
  boss.x+=boss.vx+Math.sin(boss.wobble)*0.7;
  boss.y+=boss.vy+Math.cos(boss.wobble*0.8)*0.55;
  if(boss.x<110||boss.x>W-110)boss.vx*=-1;
  if(boss.y<130||boss.y>H-110)boss.vy*=-1;
  boss.x=Math.max(110,Math.min(W-110,boss.x));
  boss.y=Math.max(130,Math.min(H-110,boss.y));
  if(boss.hitFlash>0)boss.hitFlash--;
  if(boss.hp<=BOSS_MAX_HP/2&&boss.phase===1){
    boss.phase=2;boss.laserCool=85;boss.spawnCool=130;boss.vx*=1.35;boss.vy*=1.35;
  }
  boss.laserTimer++;
  if(boss.laserTimer>=boss.laserCool){boss.laserTimer=0;fireLaser();}
}

function fireLaser(){
  if(!boss)return;
  const base=Math.atan2(player.y-boss.y,player.x-boss.x);
  const n=boss.phase===2?3:1;
  for(let i=0;i<n;i++){
    const angle=base+(i-Math.floor(n/2))*0.38;
    lasers.push({x1:boss.x,y1:boss.y,
      x2:boss.x+Math.cos(angle)*1100,y2:boss.y+Math.sin(angle)*1100,
      angle,warning:true,wTimer:48,life:0,maxLife:28,locked:false});
  }
}

function updateLasers(){
  const rem=[];
  lasers.forEach((l,i)=>{
    if(l.warning){
      l.wTimer--;
      if(!l.locked){
        if(l.wTimer<=15)l.locked=true;
        else if(boss){
          const ta=Math.atan2(player.y-boss.y,player.x-boss.x);
          let da=ta-l.angle;
          while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
          l.angle+=da*0.12;
        }
      }
      if(boss){l.x1=boss.x;l.y1=boss.y;
        l.x2=boss.x+Math.cos(l.angle)*1100;l.y2=boss.y+Math.sin(l.angle)*1100;}
      if(l.wTimer<=0){l.warning=false;l.life=l.maxLife;}
    }else{
      l.life--;
      if(l.life<=0){rem.push(i);return;}
      if(!player.invincible&&ptLine(player.x,player.y,l.x1,l.y1,l.x2,l.y2)<18){
        player.health--;player.invincible=true;player.iTimer=90;
        sfx.hit();spawnParticles(player.x,player.y,'#FF4400',10);
        if(player.health<=0)state=S.GAMEOVER;
      }
    }
  });
  for(let i=rem.length-1;i>=0;i--)lasers.splice(rem[i],1);
}

function ptLine(px,py,x1,y1,x2,y2){
  const A=px-x1,B=py-y1,C=x2-x1,D=y2-y1;
  const t=Math.max(0,Math.min(1,(A*C+B*D)/(C*C+D*D||1)));
  return Math.hypot(px-(x1+t*C),py-(y1+t*D));
}

function updateParticles(){
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.13;p.vx*=0.96;p.life--;});
  particles=particles.filter(p=>p.life>0);
}

function spawnParticles(x,y,color,n,star=false){
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2+Math.random()*0.4,sp=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,color,
      size:2+Math.random()*5,life:25+Math.random()*30,maxLife:55,star:star&&Math.random()<0.4});
  }
}


// ── DRAW HELPERS ───────────────────────────────────────────────────────────
function rrect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function star5(x,y,r){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2-Math.PI/2,ia=((i+.5)/5)*Math.PI*2-Math.PI/2;
    i===0?ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
    ctx.lineTo(x+Math.cos(ia)*r*.4,y+Math.sin(ia)*r*.4);
  }
  ctx.closePath();ctx.fill();
}
function heart(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.beginPath();
  ctx.moveTo(0,s*.35);
  ctx.bezierCurveTo(-s*1.2,-s*.7,-s*2,s*.4,0,s*1.2);
  ctx.bezierCurveTo(s*2,s*.4,s*1.2,-s*.7,0,s*.35);
  ctx.fill();ctx.restore();
}

// ── BACKGROUND ─────────────────────────────────────────────────────────────
function drawBg(){
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#6BB8D8');g.addColorStop(.5,'#7ECAE0');g.addColorStop(1,'#5EAACB');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  bgPatches.forEach(p=>{
    ctx.fillStyle=`rgba(255,255,255,${p.a})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=60;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function drawBossBg(){
  ctx.fillStyle='#0d0020';ctx.fillRect(0,0,W,H);
  if(boss){
    const t=Date.now()/1000;
    for(let i=0;i<14;i++){
      const a=(i/14)*Math.PI*2+t*.08,len=180+Math.sin(t*2+i)*55;
      ctx.strokeStyle=`rgba(180,0,60,${.13+Math.sin(t*3+i)*.07})`;
      ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(boss.x,boss.y);
      ctx.lineTo(boss.x+Math.cos(a)*len,boss.y+Math.sin(a)*len);ctx.stroke();
    }
  }
  ctx.strokeStyle='rgba(130,0,70,0.07)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=60;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

// ── DRAW PLAYER ────────────────────────────────────────────────────────────
function drawPlayer(){
  const p=player;
  p.trail.forEach((t,i)=>{
    ctx.globalAlpha=(i/p.trail.length)*.22;
    ctx.fillStyle='#FF6B35';
    ctx.beginPath();ctx.arc(t.x,t.y,9*(i/p.trail.length),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
  if(p.invincible&&Math.floor(Date.now()/80)%2===0)ctx.globalAlpha=.35;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();ctx.ellipse(4,6,20,13,0,0,Math.PI*2);ctx.fill();
  // cape trailing behind
  ctx.fillStyle='#CC0000';ctx.beginPath();
  ctx.moveTo(-10,-10);
  ctx.quadraticCurveTo(-36+Math.sin(Date.now()/200)*4,0,-28,15);
  ctx.quadraticCurveTo(-12,10,-10,10);ctx.closePath();ctx.fill();
  // body box
  ctx.fillStyle='#FF8C00';rrect(-16,-18,32,36,8);ctx.fill();
  // front panel
  ctx.fillStyle='#FFD700';rrect(-12,-14,24,28,5);ctx.fill();
  // BC logo text
  ctx.fillStyle='#CC4400';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('BC',0,4);
  // cereal O
  ctx.strokeStyle='#CC4400';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,-7,7,5,0,0,Math.PI*2);ctx.stroke();
  // mask stripe
  ctx.fillStyle='rgba(170,0,0,0.72)';ctx.fillRect(-12,-3,24,6);
  // eyes
  ctx.fillStyle='#FFF';
  ctx.beginPath();ctx.arc(-5,-1,2,0,Math.PI*2);ctx.arc(5,-1,2,0,Math.PI*2);ctx.fill();
  // nose triangle (facing direction)
  ctx.fillStyle='#FF4400';
  ctx.beginPath();ctx.moveTo(19,0);ctx.lineTo(14,-4);ctx.lineTo(14,4);ctx.closePath();ctx.fill();
  // punch fist
  if(p.punching){
    const ext=18+(1-p.punchTimer/18)*18;
    ctx.fillStyle='#FFA07A';ctx.beginPath();ctx.arc(18+ext,0,10,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#FF6B35';ctx.lineWidth=3;ctx.stroke();
    if(p.punchTimer>8){ctx.globalAlpha=.9;ctx.fillStyle='#FFD700';ctx.font='bold 15px Arial';ctx.fillText('POW!',42,-16);}
  }
  ctx.restore();ctx.globalAlpha=1;
}

// ── DRAW CEREALS ───────────────────────────────────────────────────────────
function drawCereal(c){
  if(c.collected)return;
  const pulse=1+Math.sin(c.pulse)*.1;
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.scale(pulse,pulse);
  ctx.fillStyle='rgba(0,0,0,0.14)';ctx.beginPath();ctx.ellipse(2,3,13,9,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=c.color;ctx.lineWidth=4;
  ctx.shadowColor=c.color;ctx.shadowBlur=8;
  ctx.beginPath();ctx.ellipse(0,0,13,9,0,0,Math.PI*2);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle=c.color;ctx.globalAlpha=.22;
  ctx.beginPath();ctx.ellipse(0,0,13,9,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle=c.color;
  ctx.beginPath();ctx.arc(-3,-1,1.5,0,Math.PI*2);ctx.arc(3,-1,1.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=c.color;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,1.5,3,.1,Math.PI-.1);ctx.stroke();
  ctx.restore();
}

// ── DRAW HUNGERS ───────────────────────────────────────────────────────────
function drawHunger(h){
  if(h.dying&&h.dyingTimer<=0)return;
  ctx.save();ctx.translate(h.x,h.y);
  if(h.flying)ctx.rotate(Date.now()/110);
  if(h.dying)ctx.globalAlpha=h.dyingTimer/30;
  if(h.stunned)ctx.globalAlpha=.6;
  const col=h.stunned?'#8888EE':'#6600AA';
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(3,6,22,14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,0.11)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.stroke();
  const ew=Math.sin(Date.now()/300+h.eyeP);
  ctx.fillStyle='#FF0000';ctx.shadowColor='#FF0000';ctx.shadowBlur=9;
  ctx.beginPath();ctx.arc(-7,-5+ew,5,0,Math.PI*2);ctx.arc(7,-5-ew*.5,5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#330000';ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-13,-12);ctx.lineTo(-3,-9);ctx.moveTo(13,-12);ctx.lineTo(3,-9);ctx.stroke();
  ctx.fillStyle='#1a0030';ctx.beginPath();ctx.arc(0,6,9,.2,Math.PI-.2);ctx.fill();
  ctx.fillStyle='#DDDDEE';[-6,0,6].forEach(tx=>ctx.fillRect(tx-2,6,4,5));
  ctx.globalAlpha=1;
  ctx.fillStyle='#FF4466';ctx.font='bold 10px Arial';ctx.textAlign='center';
  ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.fillText('HUNGER',0,-32);ctx.shadowBlur=0;
  ctx.restore();ctx.globalAlpha=1;
}

// ── DRAW BOSS ──────────────────────────────────────────────────────────────
function drawBoss(){
  if(!boss)return;
  const t=Date.now()/1000,pulse=Math.sin(t*2)*7,hr=boss.hp/BOSS_MAX_HP;
  ctx.save();ctx.translate(boss.x,boss.y);
  // pulse rings
  ctx.strokeStyle=`rgba(180,0,255,${.18+Math.sin(t*3)*.12})`;ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,76+pulse,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=`rgba(255,80,0,${.13+Math.sin(t*4+1)*.09})`;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,92+pulse,0,Math.PI*2);ctx.stroke();
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(9,13,68,44,0,0,Math.PI*2);ctx.fill();
  // body
  const br=Math.floor(70+(1-hr)*140);
  const bcol=boss.hitFlash>0?'#FFFFFF':`rgb(${br},0,160)`;
  ctx.fillStyle=bcol;ctx.shadowColor=boss.hitFlash>0?'#FFF':'#9900FF';ctx.shadowBlur=32;
  ctx.beginPath();ctx.arc(0,0,65,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  if(boss.hitFlash===0){
    // crown spikes
    ctx.fillStyle='#FFD700';ctx.strokeStyle='#AA7700';ctx.lineWidth=1;
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2-Math.PI/2,a2=a+Math.PI/8;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*63,Math.sin(a)*63);
      ctx.lineTo(Math.cos(a2)*84,Math.sin(a2)*84);
      ctx.lineTo(Math.cos(a+Math.PI/4)*63,Math.sin(a+Math.PI/4)*63);
      ctx.closePath();ctx.fill();ctx.stroke();
    }
    // eyes
    ctx.fillStyle='#FF0000';ctx.shadowColor='#FF0000';ctx.shadowBlur=24;
    ctx.beginPath();ctx.ellipse(-18,-12,16,12,0,0,Math.PI*2);ctx.ellipse(18,-12,16,12,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    const ea=Math.atan2(player.y-boss.y,player.x-boss.x),ex=Math.cos(ea)*5,ey=Math.sin(ea)*5;
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-18+ex,-12+ey,7,0,Math.PI*2);ctx.arc(18+ex,-12+ey,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(-14+ex,-15+ey,2.5,0,Math.PI*2);ctx.arc(22+ex,-15+ey,2.5,0,Math.PI*2);ctx.fill();
    // brows
    ctx.strokeStyle='#1a0000';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-36,-28);ctx.lineTo(-8,-22);ctx.moveTo(36,-28);ctx.lineTo(8,-22);ctx.stroke();
    // mouth
    ctx.fillStyle='#0a0018';ctx.beginPath();ctx.arc(0,18,32,.25,Math.PI-.25);ctx.fill();
    ctx.fillStyle='#DDDDF0';[-24,-12,0,12,24].forEach(tx=>ctx.fillRect(tx-5,18,10,16));
    ctx.fillStyle='#FF69B4';ctx.beginPath();ctx.ellipse(0,28,13,8,0,0,Math.PI*2);ctx.fill();
    // label
    ctx.fillStyle='#FF2244';ctx.font='bold 13px Arial';ctx.textAlign='center';
    ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText('HUNGER BOSS',0,-84);ctx.shadowBlur=0;
  }
  ctx.restore();
  // HP bar
  const bw=320,bh=22,bx=W/2-bw/2,by=15;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(bx-2,by-2,bw+4,bh+4);
  ctx.fillStyle=`hsl(${hr*120},100%,50%)`;ctx.fillRect(bx,by,bw*hr,bh);
  ctx.strokeStyle='#FF0000';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#FFF';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(`GREAT HUNGER  ${boss.hp} / ${BOSS_MAX_HP}`,W/2,by+bh-5);
}

// ── DRAW LASERS ────────────────────────────────────────────────────────────
function drawLasers(){
  lasers.forEach(l=>{
    ctx.save();
    if(l.warning){
      const a=.38+Math.sin(Date.now()/70)*.38;
      ctx.strokeStyle=`rgba(255,165,0,${a})`;ctx.lineWidth=3;
      ctx.setLineDash([12,8]);ctx.shadowColor='#FF8C00';ctx.shadowBlur=8;
      ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
      ctx.setLineDash([]);ctx.shadowBlur=0;
    }else{
      const a=l.life/l.maxLife;
      ctx.shadowColor='#FF0000';ctx.shadowBlur=22;
      ctx.strokeStyle=`rgba(255,30,30,${a*.5})`;ctx.lineWidth=22;
      ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
      ctx.strokeStyle=`rgba(255,60,60,${a})`;ctx.lineWidth=8;ctx.stroke();
      ctx.shadowBlur=0;
      ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=3;ctx.stroke();
    }
    ctx.restore();
  });
}

// ── DRAW PARTICLES ─────────────────────────────────────────────────────────
function drawParticles(){
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
    if(p.star)star5(p.x,p.y,p.size);
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife)+.5,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  });
}

// ── HUD ────────────────────────────────────────────────────────────────────
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,58);
  for(let i=0;i<player.maxHealth;i++){
    ctx.fillStyle=i<player.health?'#FF2222':'#444';heart(22+i*36,18,14);
  }
  if(state===S.PLAYING){
    ctx.fillStyle='#FFD700';ctx.font='bold 17px Arial';ctx.textAlign='left';
    ctx.fillText(`Cereals: ${player.cereals} / ${CEREAL_TOTAL}`,140,24);
    ctx.fillStyle='#333';ctx.fillRect(140,30,220,12);
    ctx.fillStyle='#FFD700';ctx.fillRect(140,30,220*(player.cereals/CEREAL_TOTAL),12);
    ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.strokeRect(140,30,220,12);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='13px Arial';ctx.textAlign='right';
    ctx.fillText('WASD/Arrows: Fly  |  SPACE/Z: Punch',W-10,24);
    ctx.fillText('Collect all 15 cereals — dodge the Hungers!',W-10,42);
  }
  if(state===S.BOSS){
    ctx.fillStyle='#FF9999';ctx.font='14px Arial';ctx.textAlign='center';
    ctx.fillText('Punch the little Hungers to launch them at the Boss! Dodge orange laser warnings!',W/2,48);
  }
}


// ── TITLE SCREEN ───────────────────────────────────────────────────────────
function drawTitle(){
  const t=Date.now()/1000;
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a001f');bg.addColorStop(.5,'#1c0044');bg.addColorStop(1,'#080015');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){
    const sx=(Math.sin(i*137.5)*.5+.5)*W,sy=(Math.cos(i*89.3)*.5+.5)*H;
    const sz=.5+Math.sin(t*2+i)*.8;
    ctx.fillStyle=`rgba(255,255,255,${.25+Math.sin(t*3+i)*.25})`;
    ctx.beginPath();ctx.arc(sx,sy,sz,0,Math.PI*2);ctx.fill();
  }
  const cc=['#FF6B35','#FFD700','#FF1493','#00CED1','#32CD32'];
  for(let i=0;i<10;i++){
    const cx=(Math.sin(t*.35+i*1.4)*.44+.5)*W,cy=(Math.cos(t*.28+i*.9)*.37+.5)*H;
    ctx.strokeStyle=cc[i%cc.length];ctx.lineWidth=3;ctx.globalAlpha=.42;
    ctx.beginPath();ctx.ellipse(cx,cy,11,8,t*.5+i,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  ctx.textAlign='center';
  ctx.shadowColor='#FF6B35';ctx.shadowBlur=36;
  ctx.fillStyle='#FFD700';ctx.font='bold 66px Arial';ctx.fillText('BRUNCH CRUNCH',W/2,128);
  ctx.shadowColor='#FFD700';ctx.shadowBlur=18;
  ctx.fillStyle='#FF6B35';ctx.font='bold 30px Arial';ctx.fillText('CEREAL SUPERHERO!',W/2,176);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.82)';ctx.font='italic 18px Arial';
  ctx.fillText('"Hungry for Brunch? Have a Crunch!"',W/2,212);
  ctx.fillStyle='rgba(0,0,0,0.6)';rrect(W/2-248,232,496,210,16);ctx.fill();
  ctx.strokeStyle='#FF6B35';ctx.lineWidth=2;rrect(W/2-248,232,496,210,16);ctx.stroke();
  ctx.fillStyle='#FFD700';ctx.font='bold 16px Arial';ctx.fillText('HOW TO PLAY',W/2,258);
  const lines=[
    'WASD / Arrow Keys  —  Fly around the arena (top-down view)',
    'SPACE / Z / X  —  Punch!',
    'Collect all 15 Cereal O\'s to unlock the Boss Fight',
    'Hungers chase you — punch them to stun (they always come back!)',
    'Boss Fight: punch little Hungers INTO the Boss to damage it',
    'Dodge the ORANGE warning lines → red laser = instant damage!'
  ];
  ctx.fillStyle='#EEE';ctx.font='14.5px Arial';
  lines.forEach((l,i)=>ctx.fillText(l,W/2,284+i*26));
  const pulse=1+Math.sin(t*3)*.04;
  ctx.save();ctx.translate(W/2,488);ctx.scale(pulse,pulse);
  ctx.fillStyle='#FF6B35';ctx.shadowColor='#FFD700';ctx.shadowBlur=18;
  rrect(-170,-28,340,58,29);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#FFF';ctx.font='bold 24px Arial';ctx.fillText('PRESS SPACE TO START!',0,9);
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.32)';ctx.font='13px Arial';
  ctx.fillText('Click game area first if keys don\'t respond',W/2,558);
}

// ── BOSS INTRO ─────────────────────────────────────────────────────────────
function drawBossIntro(){
  ctx.fillStyle='rgba(0,0,10,0.82)';ctx.fillRect(0,0,W,H);
  const prog=1-introTimer/150;
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(.6+prog*.4,.6+prog*.4);ctx.globalAlpha=prog;
  ctx.textAlign='center';
  ctx.fillStyle='#FF0000';ctx.shadowColor='#FF6600';ctx.shadowBlur=42;
  ctx.font='bold 74px Arial';ctx.fillText('BOSS INCOMING!',0,-40);ctx.shadowBlur=0;
  ctx.fillStyle='#FFAAAA';ctx.font='26px Arial';
  ctx.fillText('THE GREAT HUNGER AWAKENS!',0,18);
  ctx.fillText('Punch the little Hungers into it!',0,52);
  ctx.restore();
}

// ── VICTORY SCREEN ─────────────────────────────────────────────────────────
function drawVictory(){
  ctx.fillStyle='#000d1a';ctx.fillRect(0,0,W,H);
  const t=Date.now()/1000;
  for(let i=0;i<14;i++){
    const fx=(Math.sin(t*.9+i*2.3)*.42+.5)*W,fy=(Math.cos(t*.7+i*1.7)*.34+.38)*H;
    const hue=(i*26+t*75)%360;
    for(let j=0;j<18;j++){
      const a=(j/18)*Math.PI*2+t*(i%2===0?1:-1),r=30+Math.sin(t*3+i+j)*13;
      ctx.fillStyle=`hsla(${hue},100%,62%,0.82)`;
      ctx.beginPath();ctx.arc(fx+Math.cos(a)*r,fy+Math.sin(a)*r,2.5,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.textAlign='center';
  const bounce=Math.sin(t*3)*9;
  ctx.shadowColor='#FF6B35';ctx.shadowBlur=42;
  ctx.fillStyle='#FFD700';ctx.font='bold 82px Arial';ctx.fillText('YOU WIN!',W/2,128+bounce);
  ctx.shadowBlur=0;
  ctx.fillStyle='#FFF';ctx.font='bold 21px Arial';
  ctx.fillText('THE GREAT HUNGER HAS BEEN DEFEATED!',W/2,195);
  ctx.fillStyle='#FF6B35';ctx.fillRect(W/2-260,213,520,3);
  // ad panel
  ctx.fillStyle='rgba(255,107,53,0.11)';rrect(W/2-292,222,584,220,20);ctx.fill();
  ctx.strokeStyle='#FFD700';ctx.lineWidth=2;rrect(W/2-292,222,584,220,20);ctx.stroke();
  // cereal box left side
  drawVictoryBox(165,348);
  // slogan right side
  const sb=Math.sin(t*2)*4;
  ctx.fillStyle='#FFD700';ctx.shadowColor='#FF6B35';ctx.shadowBlur=16;
  ctx.font='bold 42px Arial';ctx.fillText('Hungry for Brunch?',W/2+65,275+sb);
  ctx.fillStyle='#FF6B35';ctx.font='bold 46px Arial';ctx.fillText('Have a Crunch!',W/2+65,328+sb);
  ctx.shadowBlur=0;
  ctx.fillStyle='#FFF';ctx.font='bold 20px Arial';ctx.fillText('Buy BRUNCH CRUNCH cereal today!',W/2+65,378);
  ctx.fillStyle='#AAAAAA';ctx.font='15px Arial';ctx.fillText('At all major grocery stores!',W/2+65,403);
  // replay button
  const rp=1+Math.sin(t*4)*.03;
  ctx.save();ctx.translate(W/2,493);ctx.scale(rp,rp);
  ctx.fillStyle='#FF6B35';ctx.shadowColor='#FF6B35';ctx.shadowBlur=12;
  rrect(-150,-24,300,50,25);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#FFF';ctx.font='bold 20px Arial';ctx.fillText('SPACE to Play Again!',0,9);
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.38)';ctx.font='13px Arial';
  ctx.fillText('~ The Cereal Superhero saves breakfast once again! ~',W/2,553);
}

function drawVictoryBox(x,y){
  ctx.save();ctx.translate(x,y);const t=Date.now()/1000;ctx.rotate(Math.sin(t)*.12);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fillRect(-42,46,84,10);
  ctx.fillStyle='#FF6B35';ctx.fillRect(-40,-58,80,108);
  ctx.fillStyle='#CC4400';ctx.fillRect(-40,-58,80,22);
  ctx.fillStyle='#FFD700';ctx.fillRect(-32,-30,64,56);
  ctx.fillStyle='#CC4400';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.fillText('BC',0,2);
  ['#FF6B35','#FF1493','#00CED1'].forEach((c,i)=>{
    ctx.strokeStyle=c;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(-12+i*12,20,8,5,i*.4,0,Math.PI*2);ctx.stroke();
  });
  ctx.fillStyle='#CC0000';ctx.beginPath();
  ctx.moveTo(38,-18);ctx.quadraticCurveTo(56+Math.sin(t*5)*6,0,44,33);ctx.lineTo(38,18);ctx.closePath();ctx.fill();
  ctx.restore();
}

// ── GAME OVER ──────────────────────────────────────────────────────────────
function drawGameOver(){
  ctx.fillStyle='rgba(14,0,0,0.93)';ctx.fillRect(0,0,W,H);
  const t=Date.now()/1000;
  ctx.textAlign='center';
  ctx.fillStyle='#FF0000';ctx.shadowColor='#880000';ctx.shadowBlur=30;
  ctx.font='bold 74px Arial';ctx.fillText('GAME OVER',W/2,210);ctx.shadowBlur=0;
  ctx.fillStyle='#FF8888';ctx.font='26px Arial';
  ctx.fillText('Hunger prevailed...',W/2,278);
  ctx.fillText('But the Cereal Superhero never gives up!',W/2,316);
  const pulse=1+Math.sin(t*3)*.04;
  ctx.save();ctx.translate(W/2,410);ctx.scale(pulse,pulse);
  ctx.fillStyle='#CC2222';rrect(-140,-24,280,52,26);ctx.fill();
  ctx.fillStyle='#FFF';ctx.font='bold 20px Arial';ctx.fillText('SPACE to Try Again!',0,9);
  ctx.restore();
}

// ── MAIN LOOP ──────────────────────────────────────────────────────────────
function loop(){
  ctx.clearRect(0,0,W,H);
  switch(state){
    case S.TITLE:
      drawTitle();
      if(jp['Space']||jp['Enter']||jp['KeyZ']){initAudio();resetGame();state=S.PLAYING;}
      break;
    case S.PLAYING:
      drawBg();
      updatePlayer();updateCereals();updateHungers();updateParticles();
      cereals.forEach(drawCereal);drawParticles();hungers.forEach(drawHunger);drawPlayer();drawHUD();
      break;
    case S.BOSS_INTRO:
      drawBossBg();drawParticles();updateParticles();drawBossIntro();
      if(--introTimer<=0){
        state=S.BOSS;
        boss={x:W*.65,y:H*.45,vx:1.3,vy:.9,hp:BOSS_MAX_HP,phase:1,
          laserTimer:60,laserCool:140,spawnTimer:0,spawnCool:200,hitFlash:0,wobble:0};
      }
      break;
    case S.BOSS:
      drawBossBg();
      updatePlayer();updateHungers();updateBoss();updateLasers();updateParticles();
      drawParticles();drawLasers();hungers.forEach(drawHunger);drawBoss();drawPlayer();drawHUD();
      break;
    case S.VICTORY:
      updateParticles();drawParticles();drawVictory();
      if(jp['Space']||jp['Enter'])state=S.TITLE;
      break;
    case S.GAMEOVER:
      drawGameOver();
      if(jp['Space']||jp['Enter'])state=S.TITLE;
      break;
  }
  clearJP();
  requestAnimationFrame(loop);
}

canvas.setAttribute('tabindex','0');canvas.focus();
document.addEventListener('click',()=>{initAudio();canvas.focus();});
requestAnimationFrame(loop);
</script>
